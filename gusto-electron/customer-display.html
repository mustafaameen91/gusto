<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاشة العميل - Gusto Restaurant</title>
    <style>
      /* Use system fonts — no internet dependency, faster load */

      :root {
        --gold: #d4a574;
        --gold-light: #e8c9a8;
        --gold-dark: #b8844a;
        --brown-deep: #05090a;
        --brown-dark: #0c1416;
        --brown-mid: #132226;
        --brown-card: #0f191c;
        --cream: #f5e6d3;
        --cream-soft: #e8d5c4;
        --text-muted: #7a8a8d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", "Tahoma", "Arial", sans-serif;
        background: var(--brown-deep);
        color: #fff;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* ─── Ambient background ─── */
      body::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(ellipse at 20% 20%, rgba(212, 165, 116, 0.04) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(212, 165, 116, 0.03) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(180, 120, 60, 0.02) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      /* ─── Header ─── */
      .header {
        background: linear-gradient(180deg, var(--brown-mid) 0%, var(--brown-deep) 100%);
        padding: 20px 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        border-bottom: 1px solid rgba(212, 165, 116, 0.15);
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }

      .header::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .header-logo {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        object-fit: cover;
        box-shadow: 0 0 20px rgba(212, 165, 116, 0.2);
      }

      .header-text {
        text-align: center;
      }

      .header-text h1 {
        font-family: "Segoe UI", "Tahoma", "Arial", sans-serif;
        font-size: 24px;
        font-weight: 800;
        color: var(--gold);
        letter-spacing: 2px;
      }

      .header-text p {
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* ─── Welcome Screen ─── */
      .welcome {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        z-index: 1;
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }

      .welcome.hidden {
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
        position: absolute;
        inset: 0;
      }

      .welcome-logo-wrap {
        position: relative;
        width: 180px;
        height: 180px;
      }

      .welcome-logo-wrap::before {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px solid rgba(212, 165, 116, 0.2);
      }

      .welcome-logo-wrap::after {
        content: "";
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        border: 1px solid rgba(212, 165, 116, 0.08);
      }

      .welcome-logo {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        object-fit: cover;
        box-shadow:
          0 0 40px rgba(212, 165, 116, 0.15),
          0 0 80px rgba(212, 165, 116, 0.05);
      }

      .welcome-title {
        text-align: center;
      }

      .welcome-title h2 {
        font-size: 42px;
        font-weight: 900;
        color: var(--gold);
        margin-bottom: 8px;
      }

      .welcome-title p {
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 18px;
        color: var(--text-muted);
        letter-spacing: 6px;
        text-transform: uppercase;
      }

      .welcome-divider {
        width: 120px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
      }

      .welcome-tagline {
        font-size: 16px;
        color: var(--text-muted);
        font-weight: 300;
        letter-spacing: 1px;
      }

      /* ─── Order View ─── */
      .order-view {
        flex: 1;
        display: none;
        flex-direction: column;
        z-index: 1;
        animation: fadeUp 0.4s ease;
      }

      .order-view.active {
        display: flex;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ─── Order Title Bar ─── */
      .order-title-bar {
        padding: 16px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }

      .order-title-bar h3 {
        font-size: 18px;
        font-weight: 600;
        color: var(--gold);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .order-title-bar h3::before {
        content: "";
        width: 3px;
        height: 18px;
        background: var(--gold);
        border-radius: 2px;
      }

      .item-count {
        background: rgba(212, 165, 116, 0.12);
        color: var(--gold);
        padding: 4px 14px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        border: 1px solid rgba(212, 165, 116, 0.15);
      }

      .table-badge {
        background: rgba(212, 165, 116, 0.1);
        color: var(--gold-light);
        padding: 4px 14px;
        border-radius: 20px;
        font-size: 13px;
        border: 1px solid rgba(212, 165, 116, 0.12);
      }

      /* ─── Items List ─── */
      .items-container {
        flex: 1;
        overflow-y: auto;
        padding: 0 32px 16px;
      }

      .items-container::-webkit-scrollbar {
        width: 3px;
      }
      .items-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .items-container::-webkit-scrollbar-thumb {
        background: rgba(212, 165, 116, 0.3);
        border-radius: 3px;
      }

      .item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        margin-bottom: 6px;
        background: linear-gradient(135deg, rgba(30, 20, 16, 0.8) 0%, rgba(30, 20, 16, 0.4) 100%);
        border-radius: 14px;
        border: 1px solid rgba(212, 165, 116, 0.08);
        animation: itemSlide 0.35s ease backwards;
        transition:
          border-color 0.3s ease,
          background 0.3s ease;
      }

      .item-row:hover {
        border-color: rgba(212, 165, 116, 0.2);
        background: linear-gradient(135deg, rgba(30, 20, 16, 0.95) 0%, rgba(30, 20, 16, 0.6) 100%);
      }

      @keyframes itemSlide {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .item-right {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1;
      }

      .item-qty {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold));
        color: var(--brown-deep);
        min-width: 34px;
        height: 34px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .item-details {
        flex: 1;
      }

      .item-name {
        font-size: 17px;
        font-weight: 600;
        color: var(--cream-soft);
        line-height: 1.3;
      }

      .item-size {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 3px;
      }

      .item-price {
        font-size: 18px;
        font-weight: 700;
        color: var(--gold);
        flex-shrink: 0;
        white-space: nowrap;
      }

      .currency {
        font-size: 11px;
        font-weight: 400;
        color: var(--text-muted);
        margin-right: 3px;
      }

      /* ─── Footer / Total ─── */
      .order-footer {
        padding: 20px 40px 24px;
        background: linear-gradient(180deg, transparent 0%, rgba(26, 15, 10, 0.9) 30%, var(--brown-dark) 100%);
        flex-shrink: 0;
        position: relative;
      }

      .order-footer::before {
        content: "";
        position: absolute;
        top: 0;
        left: 8%;
        right: 8%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.25), transparent);
      }

      .total-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .total-label {
        font-size: 22px;
        font-weight: 700;
        color: var(--cream-soft);
      }

      .total-amount {
        font-size: 42px;
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
      }

      .total-amount .currency {
        font-size: 16px;
        font-weight: 400;
        color: var(--text-muted);
        margin-right: 6px;
      }

      /* ─── Completed Order Overlay ─── */
      .order-complete {
        position: fixed;
        inset: 0;
        background: rgba(13, 7, 5, 0.97);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      .order-complete.active {
        opacity: 1;
        pointer-events: auto;
      }

      .complete-check {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold-dark), var(--gold));
        display: flex;
        align-items: center;
        justify-content: center;
        animation: checkPop 0.6s ease;
        box-shadow: 0 0 60px rgba(212, 165, 116, 0.3);
      }

      .complete-check svg {
        width: 44px;
        height: 44px;
        stroke: var(--brown-deep);
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes checkPop {
        0% {
          transform: scale(0) rotate(-20deg);
        }
        60% {
          transform: scale(1.15) rotate(5deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }

      .complete-title {
        font-size: 36px;
        font-weight: 800;
        color: var(--gold);
      }

      .complete-order-num {
        font-size: 18px;
        color: var(--text-muted);
        font-weight: 400;
      }

      .complete-divider {
        width: 80px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
      }

      .complete-total {
        font-size: 52px;
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
      }

      .complete-total .currency {
        font-size: 20px;
        font-weight: 400;
        color: var(--text-muted);
        margin-right: 6px;
      }

      .complete-subtitle {
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 16px;
        color: var(--text-muted);
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-top: 8px;
      }

      /* ─── Progress bar ─── */
      .progress-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
        z-index: 101;
        border-radius: 0 2px 2px 0;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <img class="header-logo" id="headerLogo" src="" alt="Logo" />
      <div class="header-text">
        <h1>مطعم جوستو</h1>
        <p>Gusto Restaurant</p>
      </div>
    </div>

    <!-- Welcome Screen -->
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-logo-wrap">
        <img class="welcome-logo" id="welcomeLogo" src="" alt="Logo" />
      </div>
      <div class="welcome-title">
        <h2>أهلاً وسهلاً</h2>
        <p>Welcome</p>
      </div>
      <div class="welcome-divider"></div>
      <p class="welcome-tagline">نتشرّف بخدمتكم</p>
    </div>

    <!-- Order View -->
    <div class="order-view" id="orderView">
      <div class="order-title-bar">
        <h3>طلبكم</h3>
        <div style="display: flex; gap: 8px; align-items: center">
          <span class="table-badge" id="tableBadge" style="display: none"></span>
          <span class="item-count" id="itemCount">0 صنف</span>
        </div>
      </div>

      <div class="items-container" id="itemsContainer"></div>

      <div class="order-footer" id="orderFooter" style="display: none">
        <div class="total-row">
          <span class="total-label">المجموع</span>
          <span class="total-amount" id="totalAmount">0 <span class="currency">د.ع</span></span>
        </div>
      </div>
    </div>

    <!-- Order Complete Overlay -->
    <div class="order-complete" id="orderComplete">
      <div class="complete-check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <p class="complete-title">شكراً لطلبكم</p>
      <p class="complete-order-num" id="completeOrderNum"></p>
      <div class="complete-divider"></div>
      <p class="complete-total" id="completeTotal">0 <span class="currency">د.ع</span></p>
      <p class="complete-subtitle">Thank you for your order</p>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const welcomeScreen = $("welcomeScreen");
      const orderView = $("orderView");
      const itemsContainer = $("itemsContainer");
      const orderFooter = $("orderFooter");
      const totalAmount = $("totalAmount");
      const itemCount = $("itemCount");
      const tableBadge = $("tableBadge");
      const orderComplete = $("orderComplete");
      const completeOrderNum = $("completeOrderNum");
      const completeTotal = $("completeTotal");
      const progressBar = $("progressBar");

      let dismissTimer = null;

      // ─── Set logos via IPC ───
      if (window.customerDisplayAPI) {
        window.customerDisplayAPI.onLogoReady((dataUrl) => {
          if (dataUrl) {
            $("headerLogo").src = dataUrl;
            $("welcomeLogo").src = dataUrl;
          }
        });
      }

      // ─── IPC listeners ───
      if (window.customerDisplayAPI) {
        // Live cart updates
        window.customerDisplayAPI.onCartUpdate((data) => {
          clearDismiss();
          const items = data.items || [];

          if (items.length === 0) {
            showWelcome();
            return;
          }

          showOrder();
          renderItems(items);

          const total = items.reduce((s, i) => s + (i.price || 0) * (i.quantity || 0), 0);
          setTotal(total);
          setItemCount(items);

          if (data.tableNumber) {
            tableBadge.textContent = "طاولة " + data.tableNumber;
            tableBadge.style.display = "";
          } else {
            tableBadge.style.display = "none";
          }
        });

        // Order completed
        window.customerDisplayAPI.onOrderComplete((data) => {
          showOrder();
          renderItems(data.orderItems || []);

          const total = data.totalAmount || data.totalPrice || 0;
          setTotal(total);
          setItemCount(data.orderItems || []);

          // Show overlay
          completeOrderNum.textContent = "طلب رقم #" + (data.orderNumber || "");
          completeTotal.innerHTML = total.toLocaleString() + ' <span class="currency">د.ع</span>';
          orderComplete.classList.add("active");

          // Progress bar countdown
          progressBar.style.width = "100%";
          progressBar.style.transition = "none";
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              progressBar.style.transition = "width 15s linear";
              progressBar.style.width = "0%";
            });
          });

          dismissTimer = setTimeout(() => {
            orderComplete.classList.remove("active");
            progressBar.style.width = "0%";
            showWelcome();
          }, 15000);
        });
      }

      function clearDismiss() {
        if (dismissTimer) {
          clearTimeout(dismissTimer);
          dismissTimer = null;
        }
        orderComplete.classList.remove("active");
        progressBar.style.transition = "none";
        progressBar.style.width = "0%";
      }

      function showWelcome() {
        welcomeScreen.classList.remove("hidden");
        orderView.classList.remove("active");
        orderFooter.style.display = "none";
        tableBadge.style.display = "none";
        itemsContainer.innerHTML = "";
      }

      function showOrder() {
        welcomeScreen.classList.add("hidden");
        orderView.classList.add("active");
      }

      function setTotal(val) {
        totalAmount.innerHTML = val.toLocaleString() + ' <span class="currency">د.ع</span>';
        orderFooter.style.display = "block";
      }

      function setItemCount(items) {
        const count = items.reduce((s, i) => s + (i.quantity || 1), 0);
        itemCount.textContent = count + " صنف";
      }

      function renderItems(items) {
        let html = "";
        items.forEach((item, i) => {
          const name = item.name || item.itemName || "";
          const size = item.size || item.selectedSizeName || "";
          const qty = item.quantity || 1;
          const price = (item.price || 0) * qty;

          html += `
          <div class="item-row" style="animation-delay:${i * 0.05}s">
            <div class="item-right">
              <div class="item-qty">${qty}</div>
              <div class="item-details">
                <div class="item-name">${name}</div>
                ${size ? '<div class="item-size">' + size + "</div>" : ""}
              </div>
            </div>
            <div class="item-price">${price.toLocaleString()} <span class="currency">د.ع</span></div>
          </div>`;
        });

        itemsContainer.innerHTML = html;
      }
    </script>
  </body>
</html>
