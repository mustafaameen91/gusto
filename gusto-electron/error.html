<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
  <title>تعذّر الاتصال بالنظام</title>
  <style>
    @font-face { font-family: Tajawal; font-weight: 700; src: url("assets/fonts/Tajawal-Bold.ttf"); }
    @font-face { font-family: Tajawal; font-weight: 500; src: url("assets/fonts/Tajawal-Medium.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Tajawal, Tahoma, sans-serif; font-weight: 500; direction: rtl; background: #f5f2ed; color: #2c2419; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border: 1px solid #ddd6cc; border-radius: 18px; padding: 36px 40px; max-width: 560px; width: 100%; text-align: center; }
    img { width: 150px; height: 100px; object-fit: contain; }
    h1 { font-size: 26px; margin: 14px 0 8px; color: #034b59; font-weight: 700; }
    p { font-size: 17px; line-height: 1.8; color: rgba(44,36,25,.78); }
    .addr { direction: ltr; display: inline-block; background: #f0ede8; border-radius: 8px; padding: 2px 10px; margin-top: 6px; font-family: Consolas, monospace; font-size: 15px; color: #2c2419; }
    ul { text-align: right; margin: 18px 0 0; padding-right: 20px; line-height: 2; font-size: 16px; }
    .btns { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
    button { min-height: 48px; padding: 0 22px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; border: 1px solid #046375; background: #fff; color: #046375; }
    button.primary { background: #046375; color: #fff; }
    button:focus-visible { outline: 3px solid rgba(4,99,117,.35); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/logo.png" alt="جوستو">
    <h1 id="title">تعذّر الاتصال بالنظام</h1>
    <p id="msg">لا يمكن الوصول إلى خادم المطعم الآن.</p>
    <div><span class="addr" id="addr"></span></div>
    <ul id="tips">
      <li>تأكد أن الجهاز متصل بالإنترنت أو بشبكة المطعم.</li>
      <li>تأكد أن عنوان الخادم في الإعدادات صحيح.</li>
      <li>إذا استمرت المشكلة، تواصل مع مسؤول النظام.</li>
    </ul>
    <div class="btns">
      <button class="primary" id="retry">إعادة المحاولة</button>
      <button id="settings">إعدادات الخادم والطابعات</button>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const url = q.get('url') || '';
    document.getElementById('addr').textContent = url || 'لم يُحدَّد عنوان';
    if (!url) {
      document.getElementById('title').textContent = 'أهلاً بك في نظام جوستو';
      document.getElementById('msg').textContent = 'قبل البدء، أدخل عنوان خادم المطعم واضبط الطابعات من الإعدادات.';
      document.getElementById('tips').style.display = 'none';
      document.getElementById('addr').parentElement.style.display = 'none';
    }
    document.getElementById('retry').onclick = () => window.electronAPI?.retryConnection?.();
    document.getElementById('settings').onclick = () => window.electronAPI?.openPrinterSettings?.();
  </script>
</body>
</html>
