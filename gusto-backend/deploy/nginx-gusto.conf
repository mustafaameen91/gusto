# /etc/nginx/sites-available/gusto  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d gusto.codility.tech
server {
    listen 80;
    server_name gusto.codility.tech;

    client_max_body_size 6m;   # menu/expense photos are limited to 5 MB by the app

    location / {
        proxy_pass http://127.0.0.1:3128;
        proxy_http_version 1.1;
        # live updates (kitchen/drinks screens) use WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
